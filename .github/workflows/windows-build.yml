name: Build Windows Artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'canary commit to build (set by mirror sync; leave blank for current canary)'
        required: false
        type: string
  push:
    branches:
      - canary

permissions:
  contents: write

concurrency:
  group: rolling-canary-windows
  cancel-in-progress: false

env:
  POWERSHELL_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out canary
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || 'canary' }}

      - name: Identify source commit
        id: source
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Unable to resolve checked-out commit' }
          $requested = $env:REQUESTED_SHA
          if ($requested -and $sha -ne $requested) { throw "Expected $requested but checked out $sha" }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0, 12))" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-win-x64-${{ hashFiles('**/Directory.Packages.props', '**/nuget.config', 'global.json') }}
          restore-keys: |
            nuget-win-x64-

      - name: Check LibHac package source
        id: libhac
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $HOME '.nuget/packages/ryujinx.libhac/0.21.0-alpha.133/lib/net8.0/LibHac.dll'
          if (Test-Path $cache -PathType Leaf) {
            Write-Host 'Ryujinx.LibHac is cached; restore can continue without the upstream source.'
            "available=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $url = 'https://git.ryujinx.app/api/packages/projects/nuget/index.json'
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url -TimeoutSec 12
              if ($response.StatusCode -ne 200) { throw "HTTP $($response.StatusCode)" }
              "available=true" >> $env:GITHUB_OUTPUT
              exit 0
            } catch {
              Write-Host "Package source probe $attempt/2: $_"
              if ($attempt -eq 1) { Start-Sleep -Seconds 5 }
            }
          }
          $message = 'Skipped Windows build: git.ryujinx.app is unreachable and Ryujinx.LibHac 0.21.0-alpha.133 is not cached. Existing rolling release is unchanged.'
          Write-Host "::warning::$message"
          "### $message" >> $env:GITHUB_STEP_SUMMARY
          "available=false" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies with bounded retries
        if: steps.libhac.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'src/Ryujinx/Ryujinx.csproj'
          $args = @('restore', $project, '-r', 'win-x64', '-p:Configuration=Release', '-p:SelfContained=false', '--ignore-failed-sources')
          $restored = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "NuGet restore attempt $attempt of 3"
            & dotnet @args
            if ($LASTEXITCODE -eq 0) { $restored = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          if (-not $restored) {
            throw 'NuGet restore failed after 3 attempts. Check the Ryujinx.LibHac package source and the cache; the required alpha version is not on nuget.org.'
          }

      - name: Publish Windows build
        if: steps.libhac.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish 'src/Ryujinx/Ryujinx.csproj' `
            -c Release `
            -r win-x64 `
            --no-restore `
            --self-contained false `
            -o 'publish/win-x64' `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:PublishTrimmed=false `
            -p:TrimmerSingleWarn=true `
            -p:SuppressTrimAnalysisWarnings=true
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }

      - name: Pack and verify artifact
        if: steps.libhac.outputs.available == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'publish/win-x64'
          if (-not (Test-Path "$dir/Ryujinx.exe")) { throw 'Ryujinx.exe missing from publish output' }
          Remove-Item "$dir/libarmeilleure-jitsupport.dylib" -ErrorAction SilentlyContinue
          $zip = 'publish/ryujinx-win-x64-${{ steps.source.outputs.short }}.zip'
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip) -or (Get-Item $zip).Length -eq 0) { throw 'ZIP missing or empty' }

      - name: Upload workflow artifact
        if: steps.libhac.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ryujinx-canary-win-x64-${{ steps.source.outputs.short }}
          path: publish/ryujinx-win-x64-${{ steps.source.outputs.short }}.zip
          if-no-files-found: error

      - name: Publish rolling GitHub release
        if: steps.libhac.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = gh api "repos/$env:GH_REPO/git/ref/heads/canary" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read current canary ref' }
          if ($branch.object.sha -ne $env:SOURCE_SHA) {
            Write-Host "canary has moved to $($branch.object.sha); skip publishing stale build $env:SOURCE_SHA"
            exit 0
          }

          $tag = 'rolling-canary'
          $asset = "publish/ryujinx-win-x64-$env:SOURCE_SHORT.zip"
          $release = gh api "repos/$env:GH_REPO/releases/tags/$tag" --jq .id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --target $env:SOURCE_SHA --title 'Rolling canary' --prerelease --notes "Automatically built from $env:SOURCE_SHA. This mirror keeps a local admin-run startup patch."
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create rolling release' }
          } else {
            # Upload first so a failed upload leaves the previous working asset in place.
            $assets = @(gh api "repos/$env:GH_REPO/releases/$release/assets" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'Failed to list rolling release assets' }
            $assetName = Split-Path $asset -Leaf
            if (-not @($assets | Where-Object { $_.name -eq $assetName }).Count) {
              gh release upload $tag $asset
              if ($LASTEXITCODE -ne 0) { throw 'Failed to upload new asset' }
            }
            gh api "repos/$env:GH_REPO/git/refs/tags/$tag" -X PATCH -f "sha=$env:SOURCE_SHA" -F force=true | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to advance rolling tag' }
            gh release edit $tag --title 'Rolling canary' --prerelease --notes "Automatically built from $env:SOURCE_SHA. This mirror keeps a local admin-run startup patch."
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update rolling release notes' }
            foreach ($old in $assets) {
              if ($old.name -ne $assetName) {
                gh api "repos/$env:GH_REPO/releases/assets/$($old.id)" -X DELETE
                if ($LASTEXITCODE -ne 0) { throw "Failed to remove old asset $($old.name)" }
              }
            }
          }
